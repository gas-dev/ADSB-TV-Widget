<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADSB TV · Setup</title><style>
*{box-sizing:border-box}body{margin:0;background:#071421;color:#eaf5ff;font:16px Arial,sans-serif;min-height:100vh;padding:20px}main{width:min(790px,100%);margin:0 auto;background:#10283e;padding:clamp(18px,3vw,35px);border-radius:18px;border:1px solid #38516b}h1{margin:0}p,small{color:#a9c6d7}h2{font-size:18px;margin:26px 0 12px;color:#b5e9ee}label{display:block;font-size:14px;color:#bbd6e4;margin-bottom:7px}input,select{width:100%;padding:12px;border-radius:9px;border:1px solid #567e9b;background:#071e31;color:white;font:17px Arial}input:focus,select:focus{outline:2px solid #61dfdb}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}button{margin-top:26px;width:100%;padding:15px;border:0;border-radius:11px;background:#5ddcd6;color:#062033;font-size:18px;font-weight:bold;cursor:pointer}a{color:#8ddcf4}#message{min-height:26px;margin-top:15px}@media(max-width:550px){.fields{grid-template-columns:1fr}}
</style></head><body><main><h1>⚙ ADSB TV · Setup</h1><p id="intro"></p><form id="form">
<h2 id="displayTitle"></h2><div class="fields"><div><label id="langLabel" for="language"></label><select id="language"><option value="en">English</option><option value="it">Italiano</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="ru">Русский</option></select></div><div><label id="radiusLabel" for="radius"></label><input id="radius" type="number" min="1" max="500" step="1" required></div><div><label id="countLabel" for="count"></label><input id="count" type="number" min="1" max="20" step="1" required></div><div><label id="rotationLabel" for="rotation"></label><input id="rotation" type="number" min="5" max="60" step="1" required></div></div>
<h2 id="feederTitle"></h2><div class="fields"><div><label id="hostLabel" for="host"></label><input id="host" maxlength="253" required spellcheck="false" placeholder="127.0.0.1"></div><div><label id="portLabel" for="port"></label><input id="port" type="number" min="1" max="65535" required></div></div>
<h2 id="unitsTitle"></h2><div class="fields"><div><label id="distanceLabel" for="distance"></label><select id="distance"><option value="km">Kilometres (km)</option><option value="nm">Nautical miles (NM)</option><option value="mi">Statute miles (mi)</option></select></div><div><label id="speedLabel" for="speed"></label><select id="speed"><option value="kmh">km/h</option><option value="kt">Knots (kt)</option><option value="mph">mph</option></select></div><div><label id="altitudeLabel" for="altitude"></label><select id="altitude"><option value="m">Metres (m)</option><option value="ft">Feet (ft)</option></select></div><div><label id="clockLabel" for="clock"></label><select id="clock"><option value="24h">24 h</option><option value="12h">12 h (AM/PM)</option></select></div></div>
<button type="submit" id="saveBtn"></button><div id="message" role="status"></div></form><p><a href="/" id="backLink"></a></p></main><script>
const $=id=>document.getElementById(id);
const L={
en:['Configure your display and feeder. Changes are saved and survive restarts.','Display','Language','Radar radius (km)','Closest aircraft','Seconds per aircraft','Feeder connection','Feeder IP or hostname','Feeder HTTP port','Measurement units','Distance','Speed','Altitude','Clock format','Save settings','Back to TV','Settings saved. TV updates automatically.','Unable to load settings','Saving…'],
it:['Configura il display e il feeder. Le modifiche restano salvate dopo il riavvio.','Visualizzazione','Lingua','Raggio radar (km)','Aerei più vicini','Secondi per aereo','Connessione feeder','IP o nome host del feeder','Porta HTTP del feeder','Unità di misura','Distanza','Velocità','Altitudine','Formato orario','Salva impostazioni','Torna alla TV','Impostazioni salvate. La TV si aggiorna automaticamente.','Impossibile caricare le impostazioni','Salvataggio…'],
es:['Configura la pantalla y el receptor. Los ajustes se guardan tras reiniciar.','Pantalla','Idioma','Radio del radar (km)','Aviones más cercanos','Segundos por avión','Conexión del receptor','IP o nombre del receptor','Puerto HTTP del receptor','Unidades de medida','Distancia','Velocidad','Altitud','Formato horario','Guardar ajustes','Volver a TV','Ajustes guardados. La TV se actualiza automáticamente.','No se pueden cargar los ajustes','Guardando…'],
fr:['Configurez l’écran et le récepteur. Les réglages persistent après redémarrage.','Affichage','Langue','Rayon radar (km)','Avions les plus proches','Secondes par avion','Connexion au récepteur','IP ou nom du récepteur','Port HTTP du récepteur','Unités de mesure','Distance','Vitesse','Altitude','Format horaire','Enregistrer','Retour à la TV','Réglages enregistrés. La TV se met à jour automatiquement.','Chargement des réglages impossible','Enregistrement…'],
de:['Display und Empfänger konfigurieren. Einstellungen bleiben nach Neustart erhalten.','Anzeige','Sprache','Radarradius (km)','Nächste Flugzeuge','Sekunden pro Flugzeug','Empfängerverbindung','IP oder Hostname des Empfängers','HTTP-Port des Empfängers','Maßeinheiten','Entfernung','Geschwindigkeit','Höhe','Uhrzeitformat','Einstellungen speichern','Zurück zum TV','Einstellungen gespeichert. TV aktualisiert sich automatisch.','Einstellungen konnten nicht geladen werden','Speichern…'],
ru:['Настройте экран и приёмник. Параметры сохраняются после перезагрузки.','Экран','Язык','Радиус радара (км)','Ближайшие самолёты','Секунд на самолёт','Подключение приёмника','IP или имя хоста приёмника','HTTP-порт приёмника','Единицы измерения','Расстояние','Скорость','Высота','Формат времени','Сохранить настройки','Назад к экрану','Настройки сохранены. Экран обновится автоматически.','Не удалось загрузить настройки','Сохранение…']
};
const ids=['intro','displayTitle','langLabel','radiusLabel','countLabel','rotationLabel','feederTitle','hostLabel','portLabel','unitsTitle','distanceLabel','speedLabel','altitudeLabel','clockLabel','saveBtn','backLink'];
function translate(){const lang=$('language').value, words=L[lang]||L.en;document.documentElement.lang=lang;ids.forEach((id,i)=>$(id).textContent=words[i]);}
$('language').addEventListener('change',translate);
fetch('/api/settings').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(s=>{const fields={language:s.language,radius:s.radius_km,count:s.aircraft_count,rotation:s.rotation_seconds,host:s.feeder_host,port:s.feeder_port,distance:s.distance_unit,speed:s.speed_unit,altitude:s.altitude_unit,clock:s.time_format};for(const [k,v] of Object.entries(fields))$(k).value=v;translate()}).catch(()=>{$('message').textContent=L.en[17];translate()});
$('form').addEventListener('submit',async e=>{e.preventDefault();const lang=$('language').value;$('message').textContent=L[lang][18];try{const payload={language:lang,radius_km:Number($('radius').value),aircraft_count:Number($('count').value),rotation_seconds:Number($('rotation').value),feeder_host:$('host').value.trim(),feeder_port:Number($('port').value),distance_unit:$('distance').value,speed_unit:$('speed').value,altitude_unit:$('altitude').value,time_format:$('clock').value};const res=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const body=await res.json();if(!res.ok)throw Error(body.error||'Save failed');$('message').textContent=L[lang][16]}catch(err){$('message').textContent=err.message}});
translate();
</script></body></html>
