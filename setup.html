<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADSB TV Setup</title><style>body{margin:0;background:#071421;color:#eaf5ff;font:18px Arial,sans-serif;display:grid;place-items:center;min-height:100vh}main{width:min(480px,90vw);background:#10283e;padding:36px;border-radius:20px;border:1px solid #38516b}h1{margin-top:0}label{display:block;margin:25px 0 10px}input{display:block;width:100%;box-sizing:border-box;font:22px Arial;padding:12px;border-radius:9px;border:1px solid #7791a4}button{margin-top:25px;width:100%;padding:15px;font:20px Arial;border:0;border-radius:12px;background:#5ddcd6;color:#062033;cursor:pointer}a{color:#8ddcf4}small{color:#98b8ca}#message{min-height:26px;margin-top:15px}</style><main><h1>ADSB TV · Setup</h1><p>Configura quali aeromobili visualizzare. Il radar userà automaticamente il raggio scelto.</p><form id="form"><label for="radius">Raggio massimo (km)</label><input id="radius" type="number" min="1" max="500" step="1" required><small>Da 1 a 500 km</small><label for="count">Numero di aerei più vicini</label><input id="count" type="number" min="1" max="20" step="1" required><small>Da 1 a 20 · 10 secondi per aereo</small><button type="submit">Salva configurazione</button><div id="message" role="status"></div></form><p><a href="/">Torna al widget TV</a></p></main><script>
const msg=document.getElementById('message');
fetch('/api/settings').then(r=>r.json()).then(s=>{document.getElementById('radius').value=s.radius_km;document.getElementById('count').value=s.aircraft_count}).catch(()=>{msg.textContent='Errore nel caricamento delle impostazioni'});
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Salvataggio...';try{const r=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({radius_km:Number(document.getElementById('radius').value),aircraft_count:Number(document.getElementById('count').value)})});const d=await r.json();if(!r.ok)throw Error(d.error||'Salvataggio fallito');msg.textContent='Configurazione salvata. La TV si aggiorna automaticamente.'}catch(e){msg.textContent='Errore: '+e.message}});
</script></html>
