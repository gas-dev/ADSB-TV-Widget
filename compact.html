<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ADSB TV | Compact 640×480</title>
<style>
:root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif;color:#ecf7ff;background:#06111f;--teal:#72e4ed}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(ellipse at 80% 0%,#17436b 0%,transparent 55%),#06111f}
main{width:100%;height:100%;height:100dvh;padding:10px 13px 12px;display:grid;grid-template-rows:38px minmax(0,1fr);gap:10px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #34506d;padding-bottom:6px;min-width:0}
.brand{font-weight:800;letter-spacing:.07em;font-size:18px;white-space:nowrap}
.brand span{color:#5ddcd6}a{color:#a6d9ee;text-decoration:none;font-size:13px;font-weight:bold}a:focus-visible{outline:2px solid #5ddcd6}
.tools{display:flex;align-items:center;gap:10px;white-space:nowrap}
.status{padding:5px 9px;border:1px solid #28685e;border-radius:20px;background:#10302f;color:#78edc7;font-size:12px;font-weight:bold}
.status.offline{color:#ffbd91;border-color:#824e36;background:#302019}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.14fr);gap:10px;min-height:0}
.panel{min-width:0;min-height:0;border:1px solid #294761;background:linear-gradient(145deg,#102a42,#091d30);border-radius:14px;padding:12px;overflow:hidden}
.info{display:flex;flex-direction:column;justify-content:space-between;gap:7px}
.kicker{color:#9ac2dc;text-transform:uppercase;font-size:12px;font-weight:bold;letter-spacing:.055em}
.flight{font-weight:800;font-size:clamp(26px,5.5vw,40px);line-height:1.04;overflow-wrap:anywhere;margin:5px 0 0}
.model{font-size:clamp(14px,2.6vw,18px);line-height:1.12;color:#bdd8e9;margin-top:5px;overflow-wrap:anywhere;max-height:2.4em;overflow:hidden}
.distance{font-size:clamp(34px,7.5vw,52px);line-height:1.05;font-weight:800;margin:4px 0 0}
.unit{font-size:.38em;color:#a5c5dc;white-space:nowrap}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.metric{padding:10px 9px;border:1px solid #2c506c;border-radius:11px;background:#0b2034;min-width:0}
.metric .kicker{font-size:11px}
.metric .number{font-size:clamp(23px,4.6vw,35px);font-weight:800;margin-top:5px;letter-spacing:-.03em;white-space:nowrap}
.metric .number small{font-size:.42em;font-weight:600;color:#9ec6db}
.radar-panel{display:flex;flex-direction:column;gap:8px}
.radar-head{display:flex;align-items:center;justify-content:space-between;gap:4px}
.radar{position:relative;width:min(100%,calc(100dvh - 118px));max-height:100%;aspect-ratio:1;flex:0 1 auto;align-self:center;border:1px solid #2c5a7e;border-radius:50%;background:repeating-radial-gradient(circle,#15527838 0 1px,transparent 2px 23%),linear-gradient(45deg,transparent 49.9%,#28567a 50%,transparent 50.1%),linear-gradient(135deg,transparent 49.9%,#28567a 50%,transparent 50.1%),#082036;overflow:hidden}
.radar::before{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,#1db2c02c,transparent 50deg,transparent 360deg);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.compass{position:absolute;z-index:5;font-size:13px;font-weight:bold;color:#a9d9ed}
.n{top:6px;left:50%;transform:translateX(-50%)}.s{bottom:6px;left:50%;transform:translateX(-50%)}.e{right:8px;top:50%;transform:translateY(-50%)}.w{left:8px;top:50%;transform:translateY(-50%)}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:13px;height:13px;background:#78f7c2;border:3px solid #11403c;border-radius:50%;z-index:4}
.target{position:absolute;left:50%;top:50%;width:30px;height:30px;z-index:5;transition:top 1s linear,left 1s linear;filter:drop-shadow(0 0 4px #61d4ea)}
.target svg{width:100%;height:100%;display:block;fill:#5ec2e5}.target.active{filter:drop-shadow(0 0 9px #ffe274);z-index:6}.target.active svg{fill:#ffe174}
.radar-note{font-size:12px;line-height:1.1;color:#9ac2dc;text-align:center;white-space:nowrap}
.bottom-note{font-size:11px;color:#7eabc8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:520px){main{padding:7px;gap:5px;grid-template-rows:31px minmax(0,1fr)}.brand{font-size:14px}.tools{gap:7px}.status{padding:3px 6px}.layout{gap:5px}.panel{padding:7px}.kicker{font-size:10px}.metric .kicker{font-size:9px}.metric{padding:7px 5px}.radar{width:min(100%,calc(100dvh - 91px))}}
@media(orientation:portrait){html,body{overflow:auto}main{height:auto;min-height:100dvh;grid-template-rows:auto auto}.layout{grid-template-columns:1fr}.radar{width:min(100%,60dvh)}}
@media(prefers-reduced-motion:reduce){.radar::before{animation:none}}
</style></head>
<body><main><header><div class="brand">✈ ADSB TV <span>/ COMPACT</span></div><div class="tools"><a href="/" title="Full dashboard">Full view</a><span id="status" class="status">CONNECTING</span></div></header>
<div class="layout">
<section class="panel info" aria-label="Aircraft details">
<div><div class="kicker" id="aircraftLabel">AIRCRAFT</div><div class="flight" id="flight">SEARCHING…</div><div class="model" id="model">Waiting for ADS-B data</div></div>
<div><div class="kicker" id="distanceLabel">DISTANCE</div><div class="distance"><span id="distance">--</span> <span class="unit" id="distanceUnit">km</span></div></div>
<div class="metrics"><div class="metric"><div class="kicker" id="speedLabel">SPEED</div><div class="number"><span id="speed">--</span> <small id="speedUnit">km/h</small></div></div><div class="metric"><div class="kicker" id="altitudeLabel">ALTITUDE</div><div class="number"><span id="altitude">--</span> <small id="altitudeUnit">m</small></div></div></div>
<div class="bottom-note" id="summary" aria-live="polite">Connecting to receiver…</div>
</section>
<section class="panel radar-panel" aria-label="Relative radar"><div class="radar-head"><span class="kicker" id="radarLabel">RADAR · NORTH UP</span><span class="kicker" id="range">100 km</span></div>
<div class="radar" id="radar"><span class="compass n">N</span><span class="compass e">E</span><span class="compass s">S</span><span class="compass w">W</span><div class="center"></div><div id="targets"></div></div><div class="radar-note" id="updated">Live ADS-B · 1s refresh</div></section>
</div></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const labels={
en:['AIRCRAFT','DISTANCE','SPEED','ALTITUDE','RADAR · NORTH UP','Waiting for ADS-B data','No aircraft in range','Connecting to receiver','aircraft shown','Updated'],
it:['AEROMOBILE','DISTANZA','VELOCITÀ','ALTITUDINE','RADAR · NORD IN ALTO','In attesa dei dati ADS-B','Nessun aereo nel raggio','Connessione al ricevitore','aerei visualizzati','Aggiornato'],
es:['AVIÓN','DISTANCIA','VELOCIDAD','ALTITUD','RADAR · NORTE ARRIBA','Esperando datos ADS-B','No hay aviones en el radio','Conectando al receptor','aviones mostrados','Actualizado'],
fr:['AVION','DISTANCE','VITESSE','ALTITUDE','RADAR · NORD EN HAUT','En attente des données ADS-B','Aucun avion à portée','Connexion au récepteur','avions affichés','Actualisé'],
de:['FLUGZEUG','ENTFERNUNG','TEMPO','HÖHE','RADAR · NORD OBEN','Warte auf ADS-B-Daten','Keine Flugzeuge im Radius','Verbindung zum Empfänger','Flugzeuge angezeigt','Aktualisiert'],
ru:['САМОЛЁТ','РАССТОЯНИЕ','СКОРОСТЬ','ВЫСОТА','РАДАР · СЕВЕР СВЕРХУ','Ожидание данных ADS-B','Нет самолётов в радиусе','Подключение к приёмнику','самолётов на экране','Обновлено']
};
let settings={language:'en',distance_unit:'km',speed_unit:'kmh',altitude_unit:'m',rotation_seconds:10};
let group='',idx=0,changedAt=0,loading=false;
const number=(x,places=0)=>typeof x==='number'&&Number.isFinite(x)?x.toLocaleString(settings.language,{maximumFractionDigits:places,minimumFractionDigits:places}):'--';
const distance=km=>({km:[km,'km'],nm:[km/1.852,'NM'],mi:[km/1.609344,'mi']})[settings.distance_unit]||[km,'km'];
const speed=knots=>({kmh:[knots*1.852,'km/h'],kt:[knots,'kt'],mph:[knots*1.150779448,'mph']})[settings.speed_unit]||[knots*1.852,'km/h'];
const altitude=feet=>settings.altitude_unit==='ft'?[feet,'ft']:[feet*.3048,'m'];
function translate(){const t=labels[settings.language]||labels.en;['aircraftLabel','distanceLabel','speedLabel','altitudeLabel','radarLabel'].forEach((k,i)=>$(k).textContent=t[i]);document.documentElement.lang=settings.language;return t}
function display(p,t){
$('flight').textContent=String((p.flight||'').trim()||p.r||p.hex||'--');
$('model').textContent=(p.metadata&&p.metadata.type)||p.desc||p.t||t[5];
const d=distance(p.distance_km);$('distance').textContent=number(d[0],1);$('distanceUnit').textContent=d[1];
const v=typeof p.gs==='number'?speed(p.gs):[null,speed(0)[1]];$('speed').textContent=number(v[0]);$('speedUnit').textContent=v[1];
const a=typeof p.alt_baro==='number'?altitude(p.alt_baro):[null,altitude(0)[1]];$('altitude').textContent=number(a[0]);$('altitudeUnit').textContent=a[1];
}
const aircraftPath='M32 2 L37 25 L60 40 L60 46 L36 39 L36 54 L44 59 L44 63 L32 59 L20 63 L20 59 L28 54 L28 39 L4 46 L4 40 L27 25 Z';
function radar(planes,active,radius){
const host=$('targets'),present=new Set();
for(const p of planes){if(typeof p.r_dir!=='number'||typeof p.distance_km!=='number')continue;
const key='target-'+String(p.hex||p.r||'').replace(/[^a-z0-9]/gi,'');if(!key||key==='target-')continue;present.add(key);
let node=document.getElementById(key);if(!node){node=document.createElement('div');node.id=key;node.className='target';node.innerHTML='<svg viewBox="0 0 64 64" aria-hidden="true"><path d="'+aircraftPath+'"/></svg>';host.appendChild(node)}
const rad=p.r_dir*Math.PI/180,r=Math.min(1,Math.max(0,p.distance_km/radius))*44;
node.style.left=(50+Math.sin(rad)*r)+'%';node.style.top=(50-Math.cos(rad)*r)+'%';
const heading=typeof p.track==='number'?p.track:typeof p.true_heading==='number'?p.true_heading:0;
node.style.transform='translate(-50%,-50%) rotate('+heading+'deg)';
node.classList.toggle('active',p.hex===active);
}
for(const node of Array.from(host.children))if(!present.has(node.id))node.remove();
const d=distance(radius);$('range').textContent=number(d[0])+' '+d[1];
}
async function refresh(){
if(loading)return;loading=true;
try{
const response=await fetch('/api/live',{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);
const data=await response.json();settings={...settings,...data.settings};const t=translate(),planes=data.aircraft||[],now=Date.now(),keys=planes.map(p=>p.hex).join(',');
if(keys!==group){const old=group.split(',')[idx];idx=Math.max(0,planes.findIndex(p=>p.hex===old));group=keys;changedAt=now}
if(planes.length>1&&now-changedAt>=Math.max(5,settings.rotation_seconds)*1000){idx=(idx+1)%planes.length;changedAt=now}
if(planes.length){idx=Math.min(idx,planes.length-1);display(planes[idx],t)}else{$('flight').textContent='--';$('model').textContent=t[6];$('distance').textContent=$('speed').textContent=$('altitude').textContent='--'}
radar(planes,planes[idx]?.hex,data.radius_km||100);
$('summary').textContent=planes.length+' '+t[8];$('status').textContent='LIVE';$('status').classList.remove('offline');
$('updated').textContent=t[9]+' '+new Date().toLocaleTimeString(settings.language);
}catch(error){$('status').textContent='OFFLINE';$('status').classList.add('offline');$('summary').textContent=error.message}
finally{loading=false}
}
translate();refresh();setInterval(refresh,1000);
</script></body></html>
